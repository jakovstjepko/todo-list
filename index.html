<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Moje Obveze - PWA</title>
  
  <!-- PWA Meta tags -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moje Obveze">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">

  <!-- Tailwind CSS za moderan dizajn -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons za ikone -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Stilovi za animaciju mikrofona prilikom snimanja */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .recording-active {
      animation: pulse-ring 1.5s infinite;
      background-color: #ef4444 !important;
      color: white !important;
    }
    /* Sprečavanje označavanja teksta pri dugom pritisku na gumb mikrofona */
    .no-select {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Zaglavlje -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i data-lucide="check-square" class="w-7 h-7"></i>
        <h1 class="text-xl font-bold tracking-wide">Moje Obveze</h1>
      </div>
      <span id="pwa-badge" class="hidden bg-indigo-800 text-indigo-200 text-xs px-2 py-1 rounded-full flex items-center gap-1">
        <i data-lucide="smartphone" class="w-3 h-3"></i> PWA App
      </span>
    </div>
  </header>

  <!-- Glavni sadržaj -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Obavijest za instalaciju PWA -->
    <div id="install-banner" class="hidden bg-indigo-50 border border-indigo-200 rounded-xl p-3 flex justify-between items-center shadow-sm">
      <div class="text-sm text-indigo-900">
        <p class="font-semibold">Instaliraj aplikaciju</p>
        <p class="text-xs text-indigo-700">Dodaj na početni zaslon mobitela</p>
      </div>
      <button id="install-btn" class="bg-indigo-600 text-white text-xs font-medium px-3 py-2 rounded-lg shadow hover:bg-indigo-700 transition">
        Instaliraj
      </button>
    </div>

    <!-- Forma za unos novog zadatka -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
      <div class="relative flex items-center">
        <input 
          type="text" 
          id="task-title" 
          placeholder="Unesi zadatak ili drži mikrofon..." 
          class="w-full pr-12 pl-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base"
        >
        <!-- Gumb za mikrofon -->
        <button 
          id="mic-btn" 
          type="button"
          title="Pridrži za glasovni unos"
          class="no-select absolute right-2 w-9 h-9 flex items-center justify-center rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 active:scale-95 transition"
        >
          <i data-lucide="mic" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Indikator glasovnog unosa -->
      <div id="recording-status" class="hidden text-xs text-red-500 font-medium flex items-center gap-1.5 animate-pulse pl-1">
        <span class="w-2 h-2 rounded-full bg-red-500"></span>
        Slušam... Izgovorite zadatak
      </div>

      <!-- Opcije: Prioritet i Datum -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">PRIORITET</label>
          <select id="task-priority" class="w-full p-2.5 bg-slate-50 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-500">
            <option value="low">Niski prioritet</option>
            <option value="high">Visoki prioritet</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">ROK IZVRŠENJA</label>
          <input type="date" id="task-due" class="w-full p-2 bg-slate-50 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <!-- Gumb Dodaj -->
      <button 
        id="add-task-btn" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-md shadow-indigo-200 active
